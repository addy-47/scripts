apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewatch
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewatch-cluster-role
  labels:
    app.kubernetes.io/name: kubewatch
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "services", "namespaces", "events", "persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubewatch-cluster-role-binding
  labels:
    app.kubernetes.io/name: kubewatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubewatch-cluster-role
subjects:
- kind: ServiceAccount
  name: kubewatch
  namespace: kubewatch
