apiVersion: v1
kind: ConfigMap
metadata:
  name: kubewatch-config
  namespace: kubewatch
  labels:
    app.kubernetes.io/name: kubewatch
data:
  .kubewatch.yaml: |
    handler:
      webhook: 
        url: "http://kubewatch-gchat-adapter-service.kubewatch.svc.cluster.local/webhook"
        tlsskip: true
    resource:
      daemonset: false
      deployment: false
      event: false
      job: true
      persistentvolume: false
      pod: true
      replicaset: false
      replicationcontroller: false
      services: false
      ingress: false
    customresources: []
    namespace: ""  # Empty string watches ALL namespaces cluster-wide
    event:
      global:
        - pod
      create:
        - pod
      update:
        - pod
      delete:
        - pod
