version: '3.8'

services:
  docker-watchdog:
    build: .
    container_name: docker-watchdog
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
