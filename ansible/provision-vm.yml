---
- name: Provision VM 
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    # Docker configuration variables
    docker_users:
      - "{{ ansible_user | default('addy') }}"
    docker_timeout: 300

  tasks:
    # System updates and prerequisites
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        lock_timeout: 120
      register: apt_update_result
      retries: 3
      delay: 10
      until: apt_update_result is succeeded
      
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present
        lock_timeout: 120
      register: prereq_result
      retries: 3
      delay: 5
      until: prereq_result is succeeded

    - name: Install basic system tools
      apt:
        name:
          - curl
          - wget
          - git
          - htop
          - tree
          - unzip
          - jq
          - vim
          - net-tools
          - dnsutils
          - telnet
          - ncdu
          - tmux
          - fzf
          - ripgrep
          - bat
          - fd-find
          - nano
          - build-essential

        state: present
        lock_timeout: 120
      register: tools_result
      retries: 3
      delay: 5
      until: tools_result is succeeded

    - name: Install GitHub CLI (gh)
      block:
        - name: Add GitHub CLI GPG key
          get_url:
            url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            mode: '0644'

        - name: Add GitHub CLI repository
          apt_repository:
            repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
            state: present
            filename: github-cli

        - name: Install gh package
          apt:
            name: gh
            state: present
            update_cache: yes
            lock_timeout: 120
      rescue:
        - name: Log gh installation failure
          debug:
            msg: "Failed to install GitHub CLI, skipping..."
      when: ansible_distribution == 'Ubuntu' or ansible_distribution == 'Debian'

    - name: Download and install sd (search & replace) CLI tool
      block:
        - name: Download sd binary archive from GitHub
          get_url:
            url: "https://github.com/chmln/sd/releases/download/v1.0.0/sd-v1.0.0-x86_64-unknown-linux-musl.tar.gz"
            dest: "/tmp/sd.tar.gz"
            mode: '0644'
            
        - name: Create temporary directory for extraction
          file:
            path: "/tmp/sd_extracted"
            state: directory
            mode: '0755'
            
        - name: Extract sd binary archive
          unarchive:
            src: "/tmp/sd.tar.gz"
            dest: "/tmp/sd_extracted"
            remote_src: yes
            
        - name: Install sd binary to /usr/local/bin
          copy:
            src: "/tmp/sd_extracted/sd-v1.0.0-x86_64-unknown-linux-musl/sd"
            dest: "/usr/local/bin/sd"
            owner: root
            group: root
            mode: '0755'
            remote_src: yes
            
        - name: Clean up sd temporary installation files
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/sd.tar.gz"
            - "/tmp/sd_extracted"
      rescue:
        - name: Log failure to install sd tool
          debug:
            msg: "Failed to install precompiled sd binary, skipping..."

    # Git, Tmux, and Aliases Configuration
    - name: Ensure SSH directory exists for addy
      file:
        path: /home/addy/.ssh
        state: directory
        owner: addy
        group: addy
        mode: '0700'

    - name: Generate SSH key for GitHub
      openssh_keypair:
        path: /home/addy/.ssh/id_ed25519
        type: ed25519
        comment: "adhbhut.gupta@hypr4.io"
        owner: addy
        group: addy
        mode: '0600'
      register: ssh_key_gen

    - name: Create SSH config for GitHub
      copy:
        content: |
          Host github.com
            HostName github.com
            User git
            IdentityFile /home/addy/.ssh/id_ed25519
            IdentitiesOnly yes
        dest: /home/addy/.ssh/config
        owner: addy
        group: addy
        mode: '0600'

    - name: Copy SSH key to root for GitHub access
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
        remote_src: yes
      loop:
        - src: /home/addy/.ssh/id_ed25519
          dest: /root/.ssh/id_ed25519
          mode: '0600'
        - src: /home/addy/.ssh/id_ed25519.pub
          dest: /root/.ssh/id_ed25519.pub
          mode: '0644'
      register: root_ssh_copy

    - name: Ensure SSH directory exists for root
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: root_ssh_copy is changed

    - name: Create SSH config for GitHub (root)
      copy:
        content: |
          Host github.com
            HostName github.com
            User git
            IdentityFile /root/.ssh/id_ed25519
            IdentitiesOnly yes
        dest: /root/.ssh/config
        owner: root
        group: root
        mode: '0600'

    - name: Read generated public key
      slurp:
        src: /home/addy/.ssh/id_ed25519.pub
      register: public_key_b64

    - name: Set public key fact
      set_fact:
        public_key_content: "{{ public_key_b64.content | b64decode | trim }}"

    - name: Check for GitHub Personal Access Token
      set_fact:
        github_token: "{{ lookup('env', 'GITHUB_TOKEN') | default(lookup('ini', 'GITHUB_TOKEN type=properties file=.env'), true) | default('', true) }}"

    - name: Automatically add SSH key to GitHub (if GITHUB_TOKEN is set)
      uri:
        url: "https://api.github.com/user/keys"
        method: POST
        headers:
          Authorization: "token {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          title: "VM-{{ ansible_host }}-{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"
          key: "{{ public_key_content }}"
        status_code: 201
      register: github_api_response
      ignore_errors: yes
      when: github_token != ""

    - name: Display SSH Key Instructions
      debug:
        msg: |
          ==================================================================
          GITHUB SSH KEY REGISTRATION
          ==================================================================
          {% if github_token != "" and github_api_response is succeeded %}
          SUCCESS: Your SSH key was automatically added to GitHub!
          {% else %}
          ACTION REQUIRED: Please add the following public key to your GitHub account:
          URL: https://github.com/settings/keys
          
          {{ public_key_content }}
          {% endif %}
          ==================================================================

    - name: Copy tmux configuration globally to /etc/tmux.conf
      copy:
        src: /home/addy/.tmux.conf.bash
        dest: /etc/tmux.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy tmux configuration to /etc/.tmux.conf as requested
      copy:
        src: /home/addy/.tmux.conf.bash
        dest: /etc/.tmux.conf
        owner: root
        group: root
        mode: '0644'

    - name: Ensure Oh-My-Zsh custom directory exists
      file:
        path: /home/addy/.oh-my-zsh/custom
        state: directory
        owner: addy
        group: addy
        mode: '0755'

    - name: Copy zsh aliases to Oh-My-Zsh custom directory
      copy:
        src: /home/addy/.oh-my-zsh/custom/aliases.zsh
        dest: /home/addy/.oh-my-zsh/custom/aliases.zsh
        owner: addy
        group: addy
        mode: '0644'

    - name: Append custom aliases to ~/.bashrc for Bash compatibility
      blockinfile:
        path: /home/addy/.bashrc
        block: "{{ lookup('file', '/home/addy/.oh-my-zsh/custom/aliases.zsh') }}"
        marker: "# {mark} ANSIBLE MANAGED ALIASES"
        owner: addy
        group: addy
        mode: '0644'

    # Root aliases configuration
    - name: Ensure Oh-My-Zsh custom directory exists for root
      file:
        path: /root/.oh-my-zsh/custom
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy zsh aliases to root's Oh-My-Zsh custom directory
      copy:
        src: /home/addy/.oh-my-zsh/custom/aliases.zsh
        dest: /root/.oh-my-zsh/custom/aliases.zsh
        owner: root
        group: root
        mode: '0644'

    - name: Append custom aliases to root's ~/.bashrc
      blockinfile:
        path: /root/.bashrc
        block: "{{ lookup('file', '/home/addy/.oh-my-zsh/custom/aliases.zsh') }}"
        marker: "# {mark} ANSIBLE MANAGED ALIASES"
        owner: root
        group: root
        mode: '0644'

    # Git configuration for addy
    - name: Ensure .gitconfig for addy user
      copy:
        content: |
          [user]
          	name = addy-hypr4
          	email = adhbhut.gupta@hypr4.io
          [push]
          	autoSetupRemote = true
        dest: /home/addy/.gitconfig
        owner: addy
        group: addy
        mode: '0644'

    # Git configuration for root
    - name: Ensure .gitconfig for root
      copy:
        content: |
          [user]
          	name = addy-hypr4
          	email = adhbhut.gupta@hypr4.io
          [push]
          	autoSetupRemote = true
        dest: /root/.gitconfig
        owner: root
        group: root
        mode: '0644'

    # Docker installation
    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
        
    - name: Add Docker GPG key
      block:
        - name: Download Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /tmp/docker.gpg
            mode: '0644'
          register: gpg_download
          retries: 3
          delay: 5
          until: gpg_download is succeeded
          
        - name: Import Docker GPG key
          shell: |
            gpg --dearmor < /tmp/docker.gpg > /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
          args:
            creates: /etc/apt/keyrings/docker.gpg
      rescue:
        - name: Log GPG key installation failure
          debug:
            msg: "Failed to install Docker GPG key. Attempting alternative method..."
            
        - name: Add Docker GPG key (alternative method)
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present
          register: alt_gpg_result
          retries: 3
          delay: 5
          until: alt_gpg_result is succeeded

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      register: repo_result
      retries: 3
      delay: 5
      until: repo_result is succeeded
      
    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes
        cache_valid_time: 0
        lock_timeout: 120
      register: docker_apt_update
      retries: 3
      delay: 10
      until: docker_apt_update is succeeded

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
        lock_timeout: 120
      register: docker_install
      retries: 3
      delay: 10
      until: docker_install is succeeded
      notify:
        - start docker
        - enable docker

    # Docker service configuration
    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
      register: docker_service
      retries: 3
      delay: 5
      until: docker_service is succeeded

    - name: Wait for Docker socket to be available
      wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 60
      register: docker_socket_wait
      retries: 3
      delay: 10
      until: docker_socket_wait is succeeded

    # User configuration
    - name: Create docker group
      group:
        name: docker
        state: present

    - name: Add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ docker_users }}"
      when: docker_users is defined and docker_users | length > 0

    # Network tools installation
    - name: Install additional network tools
      apt:
        name:
          - tcpdump
          - iperf3
          - nmap
          - iputils-ping
        state: present
        lock_timeout: 120
      register: network_tools_result
      retries: 2
      delay: 5
      until: network_tools_result is succeeded
      ignore_errors: yes

    # Monitoring tools installation
    - name: Install monitoring tools
      apt:
        name:
          - htop
          - iotop
          - nethogs
          - iftop
        state: present
        lock_timeout: 120
      register: monitoring_tools_result
      retries: 2
      delay: 5
      until: monitoring_tools_result is succeeded
      ignore_errors: yes

    # UFW firewall configuration
    - name: Configure UFW firewall rules
      block:
        - name: Allow SSH, HTTP, and HTTPS ports
          ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop:
            - 22
            - 80
            - 443
          notify: enable ufw
      rescue:
        - name: Log UFW configuration failure
          debug:
            msg: "UFW configuration failed, continuing without firewall setup"
      ignore_errors: yes

    # Verification tasks
    - name: Verify Docker installation
      block:
        - name: Check Docker version
          command: docker --version
          register: docker_version_check
          changed_when: false
          
        - name: Check Docker Compose version
          command: docker compose version
          register: docker_compose_version_check
          changed_when: false
          
        - name: Display Docker version
          debug:
            msg: "Docker version: {{ docker_version_check.stdout }}"
            
        - name: Display Docker Compose version
          debug:
            msg: "Docker Compose version: {{ docker_compose_version_check.stdout }}"

      rescue:
        - name: Log verification failure
          debug:
            msg: "Docker verification failed, but installation may still be functional"

    # System cleanup
    - name: Clean up temporary files
      file:
        path: /tmp/docker.gpg
        state: absent
      ignore_errors: yes

    # Final status report
    - name: Display installation summary
      debug:
        msg: |
          ================================
          VM Provisioning Complete!
          ================================
          System: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Architecture: {{ ansible_architecture }}
          Docker: {{ docker_version_check.stdout | default('Version check failed') }}
          Docker Compose: {{ docker_compose_version_check.stdout | default('Version check failed') }}
          Docker Users: {{ docker_users | join(', ') }}
          ================================

  handlers:
    - name: start docker
      systemd:
        name: docker
        state: started
        
    - name: enable docker
      systemd:
        name: docker
        enabled: yes
        
    - name: enable ufw
      ufw:
        state: enabled
        policy: deny
      ignore_errors: yes

  post_tasks:
    - name: Final system status check
      block:
        - name: Check if Docker daemon is running
          systemd:
            name: docker
          register: docker_status
          
        - name: Verify Docker group membership
          command: "groups {{ ansible_user | default('addy') }}"
          register: user_groups
          changed_when: false
          
        - name: Display final status
          debug:
            msg: |
              Docker Service Status: {{ docker_status.status.ActiveState | default('unknown') }}
              User Groups: {{ user_groups.stdout | default('check failed') }}
              
              IMPORTANT: If user was added to docker group, logout and login again to apply changes.
              Alternatively, run: newgrp docker
      rescue:
        - name: Log post-task failure
          debug:
            msg: "Post-task checks failed, but installation should be complete"
